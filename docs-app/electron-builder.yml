appId: com.agroecosystem.docs
productName: AgroEcosystem Docs
directories:
  output: dist
files:
  - main.js
  - package.json
extraResources:
  - from: ../docs-site
    to: docs
    filter:
      - "**/*"
win:
  signAndEditExecutable: false
  target:
    - nsis
    - portable
  icon: ../cell_phone/assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: AgroEcosystem Docs
portable:
  artifactName: AgroEcosystem-Docs-portable.exe
