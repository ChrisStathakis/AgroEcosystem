<div class="row g-3 mb-4">
  <div class="col-sm-4"><div class="panel stat"><div class="stat-label">Συνολικά έσοδα <span class="float-end positive" aria-hidden="true">↙</span></div><div class="stat-value">{{ summary.income_total|floatformat:'2g' }}</div><div class="stat-note">Καταγεγραμμένα το {{ summary.year }}</div></div></div>
  <div class="col-sm-4"><div class="panel stat"><div class="stat-label">Συνολικά έξοδα <span class="float-end negative" aria-hidden="true">↗</span></div><div class="stat-value">{{ summary.expense_total|floatformat:'2g' }}</div><div class="stat-note">Καταγεγραμμένα το {{ summary.year }}</div></div></div>
  <div class="col-sm-4"><div class="panel stat stat-featured"><div class="stat-label">Καθαρό υπόλοιπο <span class="float-end" aria-hidden="true">≈</span></div><div class="stat-value">{{ summary.balance|floatformat:'2g' }}</div><div class="stat-note">Έσοδα μείον έξοδα · {{ summary.year }}</div></div></div>
</div>
