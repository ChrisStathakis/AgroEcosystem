{% if page.has_other_pages %}<nav class="p-3 border-top d-flex align-items-center justify-content-between flex-wrap gap-3" aria-label="Record pagination"><span class="small text-secondary">Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span><ul class="pagination pagination-sm mb-0">{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ query_params }}&amp;page={{ page.previous_page_number }}">Previous</a></li>{% endif %}<li class="page-item active"><span class="page-link" aria-current="page">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>{% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ query_params }}&amp;page={{ page.next_page_number }}">Next</a></li>{% endif %}</ul></nav>{% endif %}
